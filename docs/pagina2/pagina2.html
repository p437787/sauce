<body class="flequillo">

  <div class="wrapper">

  <div id="header"></div>

  class="pixelfed__embed" 
  style="max-width: 100%; border: 0;" 
  width="500" 
  height="600"

      <figure class="item">

      document.getElementById('hora').textContent = ahora.toLocaleTimeString();

    setInterval(actualizarHora, 1000);
    actualizarHora();
